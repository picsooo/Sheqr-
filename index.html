<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>She's Fit & Beauty — Liens</title>
<meta name="description" content="Boutique en ligne de mode féminine algérienne — livraison 58 wilayas, paiement à la livraison.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9A25B; --gold-deep:#8E6A2C; --gold-soft:#F3E6C8;
  --pink:#E6197E; --pink-deep:#B8105F;
  --ink:#2A1F14; --paper:#FBF7EF; --line:rgba(142,106,44,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#F6ECD9; --paper:#1C1610; --line:rgba(201,162,91,.35); --gold-soft:#2B2217; }
}
:root[data-theme="dark"]{ --ink:#F6ECD9; --paper:#1C1610; --line:rgba(201,162,91,.35); --gold-soft:#2B2217; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  background:
    radial-gradient(120% 60% at 50% 0%, var(--gold-soft) 0%, transparent 70%),
    var(--paper);
  color:var(--ink);
  font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:440px;margin:0 auto;padding:40px 22px 36px;text-align:center}
.logo{
  width:168px;height:168px;display:block;margin:0 auto 18px;
  filter:drop-shadow(0 14px 28px rgba(142,106,44,.35));
  animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
h1{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
  font-size:2.1rem;line-height:1.1;margin:0;letter-spacing:.01em;
}
.ar{
  font-family:"Tajawal",system-ui,sans-serif;font-weight:700;
  font-size:1.15rem;color:var(--pink);margin:6px 0 10px;
}
.tag{font-size:.95rem;line-height:1.55;margin:0 auto 26px;max-width:32ch;opacity:.8}
.tag span{display:block;font-family:"Tajawal",sans-serif;font-weight:500;margin-top:4px}
.links{display:flex;flex-direction:column;gap:12px}
.btn{
  display:flex;align-items:center;gap:14px;
  padding:15px 18px;border-radius:999px;
  text-decoration:none;color:var(--ink);
  border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 70%,transparent);
  font-weight:500;font-size:1rem;
  transition:transform .15s ease, border-color .15s ease;
}
.btn:active{transform:scale(.98)}
.btn:hover{border-color:var(--gold)}
.btn:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.btn svg{width:22px;height:22px;flex:none}
.btn .t{flex:1;text-align:left}
.btn .sub{display:block;font-size:.8rem;opacity:.65;font-weight:400}
.btn.shop{background:linear-gradient(135deg,#D8B774,#B98C3E);border:0;color:#2A1F14}
.btn.wa{background:var(--pink);border:0;color:#fff}
.btn.wa:hover{background:var(--pink-deep)}
.sep{height:1px;background:var(--line);margin:8px 30px}
.socials{display:flex;justify-content:center;gap:14px;margin-top:22px}
.socials a{
  width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--gold-deep);
}
:root:not([data-theme="light"]) .socials a{color:var(--gold)}
.socials a:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.socials svg{width:22px;height:22px}
footer{margin-top:30px;font-size:.78rem;opacity:.55}
@media (prefers-reduced-motion:reduce){.logo{animation:none}}
</style>
</head>
